services:
  tidecloak-data-init:
    image: tideorg/tidecloak-dev:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /tide-data"]
    volumes:
      - tidecloak-data:/tide-data
    restart: "no"

  tidecloak:
    image: tideorg/tidecloak-dev:latest
    depends_on:
      tidecloak-data-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${TIDE_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TIDE_ADMIN_PASSWORD:?Set TIDE_ADMIN_PASSWORD in .env.tide.local}
    volumes:
      - tidecloak-data:/opt/keycloak/data/h2

volumes:
  tidecloak-data:
